<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 560px);
      padding: 48px 32px;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(31, 41, 55, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      color: #111827;
      font-size: 2.5rem;
    }

    p {
      margin: 0 0 28px;
      color: #6b7280;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 12px 24px;
      color: #ffffff;
      background: #2563eb;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome</h1>
    <p>A simple, clean starting point for your next project.</p>
    <a href="#learn-more">Get Started</a>
  </main>
</body>
</html>
